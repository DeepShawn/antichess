name: Android arm64 Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
      - name: Bundle official Stockfish 19 ARM64 engine
        # Packaged as a native library so Android extracts it to nativeLibraryDir,
        # the only app location that may be executed on Android 10+.
        run: |
          curl -L --fail --retry 3 -o /tmp/stockfish19.tar.gz \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-android-arm64-universal.tar.gz
          mkdir -p app/src/main/jniLibs/arm64-v8a
          tar -xOf /tmp/stockfish19.tar.gz stockfish/stockfish-android-arm64-universal \
            > app/src/main/jniLibs/arm64-v8a/libstockfish.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libstockfish.so
          test -s app/src/main/jniLibs/arm64-v8a/libstockfish.so
      - name: Kotlin core tests
        run: gradle --no-daemon :core:test
      - name: Prepare stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          encoded=$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]')
          case "$encoded" in ANDROID_KEYSTORE_BASE64=*) encoded="${encoded#*=}";; esac
          remainder=$((${#encoded} % 4))
          if [ "$remainder" -eq 2 ]; then encoded="${encoded}=="; elif [ "$remainder" -eq 3 ]; then encoded="${encoded}="; fi
          printf '%s' "$encoded" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/puzhe-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/puzhe-release.keystore" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/puzhe-release.keystore" >> "$GITHUB_ENV"
      - name: Build arm64 release APK
        run: gradle --no-daemon assembleRelease
      - name: Normalize APK name
        run: |
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" app/build/outputs/apk/release/puzhe-chess-arm64.apk
      - name: Create checksums
        run: sha256sum app/build/outputs/apk/release/puzhe-chess-arm64.apk > app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/puzhe-chess-arm64.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
