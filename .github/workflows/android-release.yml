name: Android arm64 Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
      - name: Build arm64 release APK
        run: gradle --no-daemon assembleRelease
      - name: Sign release APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/release.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/release.keystore" \
              -storepass android -keypass android -alias puzhe \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=PuZhe Chess, OU=Chess Lab, O=DeepShawn, C=CN"
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$HOME/.android/release.keystore" --ks-pass pass:android \
            --key-pass pass:android "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
      - name: Normalize APK name
        run: |
          apk=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" app/build/outputs/apk/release/puzhe-chess-arm64.apk
      - name: Create checksums
        run: sha256sum app/build/outputs/apk/release/puzhe-chess-arm64.apk > app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/puzhe-chess-arm64.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
