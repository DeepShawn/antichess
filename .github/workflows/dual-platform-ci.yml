name: Dual Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate web bundle
        run: |
          test -s index.html
          python3 -m http.server 4173 >/tmp/puzhe-pages.log 2>&1 &
          server=$!
          sleep 1
          curl --fail http://127.0.0.1:4173/index.html >/dev/null
          kill "$server"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
      - run: gradle --no-daemon assembleRelease
