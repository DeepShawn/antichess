name: Dual Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chess core, engine and personality tests (perft-verified)
        run: npm test
      - name: Smoke-test the static site
        run: |
          node tools/serve.mjs >/tmp/puzhe-pages.log 2>&1 &
          server=$!
          sleep 1
          for path in / src/main.js data/openings.txt data/pieces.json vendor/stockfish/stockfish-19-lite-single.wasm manifest.webmanifest sw.js; do
            curl --fail --silent --show-error "http://127.0.0.1:4173/$path" >/dev/null
          done
          kill "$server"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
      - name: Kotlin core tests (same perft suite as the web)
        run: gradle --no-daemon :core:test
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
